[build-system]
requires = ["setuptools>=66"]
build-backend = "setuptools.build_meta"

[project]
name = "cuktech-ad1204u"
version = "0.3.5"
description = "Local BLE telemetry client for the CUKTECH AD1204U charger (Mijia njcuk.fitting.ad1204)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22",
    "bleak-retry-connector>=3.5",
    "cryptography>=42",
]

[project.optional-dependencies]
test = [
    "aiohttp>=3.11",
    "pytest>=8",
    "ruff>=0.12,<1",
]
cloud-token = [
    # Used only by tools/ad1204u_fetch_token.py to pull the BLE token from the
    # Xiaomi cloud. Not required for runtime / HA integration.
    "requests>=2.31",
]

[dependency-groups]
dev = [
    # Runtime imports reached through Home Assistant's Bluetooth integration.
    "aiousbwatcher>=1.1.2",
    "homeassistant-stubs>=2026.8.3",
    "serialx>=1.8.2",
    "ty>=0.0.1a14",
]

[tool.uv.dependency-groups]
# Current Home Assistant stubs follow HA's newer Python requirement. Keep that
# tooling constraint separate from the integration's supported Python floor.
dev = { requires-python = ">=3.14.2" }

[tool.setuptools]
# The runtime library is vendored inside custom_components/cuktech_ble/lib/
# so Home Assistant can import it at load time. For dev/tests/tools, we map the
# top-level `cuktech_ble` import to the same location.
package-dir = {"cuktech_ble" = "custom_components/cuktech_ble/lib"}
packages = [
    "cuktech_ble",
    "cuktech_ble.miot",
    "cuktech_ble.xiaomi",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ty.src]
include = ["custom_components/cuktech_ble"]
